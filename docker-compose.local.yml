# Local HTTP smoke test — verifies images build, containers start and Caddy
# routes correctly, WITHOUT needing DNS or a Let's Encrypt certificate.
# Publishes plain HTTP on 8080 only; does not replace the HTTPS/WSS check
# that can only happen on the real CloudFly VPS once DNS points at it.
#
# Usage (see docs/DEPLOYMENT_STAGING.md, section 6.5 of the deployment plan):
#   docker compose -f docker-compose.local.yml config
#   docker compose -f docker-compose.local.yml build
#   docker compose -f docker-compose.local.yml up -d
#   curl -f http://localhost:8080/
#   curl -f http://localhost:8080/health
#   docker compose -f docker-compose.local.yml ps
#   docker compose -f docker-compose.local.yml logs --tail=200
#   docker compose -f docker-compose.local.yml down     # NOT `down -v`

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      JWT_SECRET: local-smoke-test-secret-not-for-production
      DATABASE_URL: sqlite+aiosqlite:////app/data/app.db
      STORAGE_DIR: /app/data
      REVIEW_DIR: /app/data/review
      # Local override: real CORS_ORIGINS in production is the https domain
      # (see .env.production.example) — this http://localhost:8080 value must
      # never be used outside this local compose file.
      CORS_ORIGINS: http://localhost:8080
      ALLOW_SELF_REGISTER: "true"
      ALLOW_SELF_REVIEW: "false"
      TRAINING_ENABLED: "false"
    volumes:
      - local_data:/app/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Local override only — production build args point at the real
        # https domain (see docker-compose.prod.yml). Never reuse these
        # http://localhost values in a production build.
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_API_ORIGIN: http://localhost:8080
        NEXT_PUBLIC_WS_BASE: ws://localhost:8080
        NEXT_PUBLIC_TRAINING_ENABLED: "false"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  local_data:
