[mypy]
# No top-level ignore_missing_imports: it would silence a genuine typo or a
# wrong import path in our own modules just as readily as a real missing
# stub, so it stays scoped per third-party package below instead.

# Research/robotics dependencies with no py.typed marker and no maintained
# stub package on PyPI as of this writing (verified against the versions
# actually installed in .venv, not assumed) — mypy cannot see into them no
# matter how our own code is annotated, so there is no type-safety upside to
# chasing these, only churn if a mistyped module name were later silenced.
[mypy-mujoco.*]
ignore_missing_imports = True

[mypy-robosuite.*]
ignore_missing_imports = True

[mypy-robomimic.*]
ignore_missing_imports = True

[mypy-h5py.*]
ignore_missing_imports = True

[mypy-pyarrow.*]
ignore_missing_imports = True

[mypy-OpenGL.*]
ignore_missing_imports = True

[mypy-scipy.spatial.*]
ignore_missing_imports = True

[mypy-scipy.signal.*]
ignore_missing_imports = True

# Not installed in the core (non-training) environment by design — see
# requirements-train.txt vs requirements.txt and src/config.py
# Settings.training_enabled. src/training/robomimic_bc.py imports it lazily
# inside functions that only run when training is actually invoked.
[mypy-torch.*]
ignore_missing_imports = True
